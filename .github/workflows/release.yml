name: Release

run-name: Release libSession ${{ inputs.libsession_tag }}

# Manual release workflow. Mirrors prepare_release.sh's default (non `-b`) path:
#   1. Fetch the prebuilt xcframework that libsession-util's own CI published to
#      oxen.rocks for the given tag.
#   2. Fetch that tag's LICENSE from libsession-util.
#   3. Repackage the xcframework and compute the SPM checksum.
#   4. Regenerate README.md and Package.swift from assets/*.in.
#   5. Commit, tag `<version>` (no `v`), push, and publish a GitHub release with
#      the zip attached.
#
# Runs on macOS because `ditto` (Darwin-only) produces the archive, and the
# checksum comes from `swift package compute-checksum`. The repo is public, so
# GitHub-hosted macOS runners are free.
#
# Requires (repo settings, one-time):
#   - Settings > Actions > General > Workflow permissions: "Read and write
#     permissions", so GITHUB_TOKEN can push the commit/tag and create the release.
#   - Branch protection on `main` must allow this push.

on:
  workflow_dispatch:
    inputs:
      libsession_tag:
        description: "libsession-util tag to package (e.g. v1.6.7)"
        required: true
        type: string
      force:
        description: "Re-release even if README already names this version"
        required: false
        default: false
        type: boolean

concurrency:
  group: spm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      LIBSESSION_TAG: ${{ inputs.libsession_tag }}
      OXEN_ROCKS_URL: https://oxen.rocks/session-foundation/libsession-util

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Derive versions
        id: vers
        run: |
          set -euo pipefail
          tag="${LIBSESSION_TAG}"
          # prepare_release.sh: new_version strips a leading `v`, upstream_version keeps it.
          echo "new_version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "upstream_version=${tag}" >> "$GITHUB_OUTPUT"

      # The interactive script falls back tag -> stable -> dev when a tag build is
      # missing. That is right for a human who sees which one it hit and wrong here:
      # unattended it would publish a `dev` snapshot under a release tag with no
      # signal. Require the exact tag and fail otherwise.
      - name: Require an exact-tag build on oxen.rocks
        id: src
        run: |
          set -euo pipefail
          file="libsession-util-ios-${LIBSESSION_TAG}.tar.xz"
          url="${OXEN_ROCKS_URL}/${LIBSESSION_TAG}/${file}"
          code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 60 "$url" || true)
          if [ "$code" != "200" ]; then
            echo "::error::No exact-tag build at $url (HTTP $code). Not falling back to stable/dev."
            exit 1
          fi
          echo "url=$url"   >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Skip if the version is unchanged
        if: ${{ !inputs.force }}
        run: |
          set -euo pipefail
          current="$(grep '\* LibSession-Util' README.md | cut -d '*' -f 3 | tr -d '[:space:]')"
          if [ "$current" = "${{ steps.vers.outputs.new_version }}" ]; then
            echo "::error::README already names ${current}. Re-run with force: true to re-release."
            exit 1
          fi

      - name: Download and unpack the xcframework
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fSL --max-time 600 -o "work/${{ steps.src.outputs.file }}" "${{ steps.src.outputs.url }}"
          tar -xf "work/${{ steps.src.outputs.file }}" -C work
          test -d "work/libsession-util-ios-${LIBSESSION_TAG}/libsession-util.xcframework"

      - name: Fetch the LICENSE for that tag
        run: |
          set -euo pipefail
          curl -fSL --max-time 60 \
            -o LICENSE \
            "https://raw.githubusercontent.com/session-foundation/libsession-util/refs/tags/${LIBSESSION_TAG}/LICENSE"

      # `ditto` rather than `zip`: it is what prepare_release.sh uses, and it
      # preserves the symlinks and metadata inside a .framework. This is the step
      # that makes the job macOS-only.
      - name: Package the xcframework
        run: |
          set -euo pipefail
          ditto -c -k --keepParent \
            "work/libsession-util-ios-${LIBSESSION_TAG}/libsession-util.xcframework" \
            libsession-util.xcframework.zip

      - name: Compute the SPM checksum
        id: sum
        run: |
          set -euo pipefail
          echo "checksum=$(swift package compute-checksum libsession-util.xcframework.zip)" >> "$GITHUB_OUTPUT"

      # envsubst is GNU gettext and is NOT on the macOS runner's PATH by default.
      - name: Regenerate README.md and Package.swift
        env:
          new_version: ${{ steps.vers.outputs.new_version }}
          upstream_version: ${{ steps.vers.outputs.upstream_version }}
          checksum: ${{ steps.sum.outputs.checksum }}
        run: |
          set -euo pipefail
          brew list gettext >/dev/null 2>&1 || brew install gettext
          envsubst="$(brew --prefix gettext)/bin/envsubst"
          "$envsubst" < assets/README.md.in    > README.md
          "$envsubst" < assets/Package.swift.in > Package.swift
          # The release does not exist yet, so the URL cannot be fetched — assert the
          # two values that must agree with the asset we are about to upload.
          grep -q "${{ steps.sum.outputs.checksum }}" Package.swift
          grep -q "download/${{ steps.vers.outputs.new_version }}/" Package.swift

      - name: Commit and tag
        run: |
          set -euo pipefail
          msg="libSession Swift Package Manager ${{ steps.vers.outputs.new_version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md Package.swift LICENSE libsession-util.xcframework.zip
          git commit -m "$msg"
          git tag -m "$msg" "${{ steps.vers.outputs.new_version }}"
          git push origin HEAD:main
          git push origin "${{ steps.vers.outputs.new_version }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.vers.outputs.new_version }}" \
            libsession-util.xcframework.zip \
            --title "libSession Swift Package Manager ${{ steps.vers.outputs.new_version }}" \
            --notes "Packages libsession-util ${LIBSESSION_TAG}."
